    <!-- <input type="text" onkeyup="fun(event)"> -->
     <input type="text" onfocus="fun(event)" onblur="funn(event)" onchange="funnn(event)">
    <script>
        function fun(event){
            event.target.style.background = "yellow"
            // console.log(event)
        }
        function funn(event){
            event.target.style.background = "red"
            // console.log(event)
        }
        function funnn(event){
            console.log("harman");
        }
    </script>
